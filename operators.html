<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=10;
        var b = 20;
        // increment and decrement operator
        document.write("post increment operator: " + (a++));
        document.write("<br>");
        document.write("pre increment operator: " + (++a));
        document.write("<br>");
        document.write("pre decrement operator: " + (--b));
        document.write("<br>");   
        document.write("post decrement operator: " + (b--));
        document.write("<br>");
        document.write("<hr>");
        
        // comparison operator
        document.write("comparison operator: ");
        document.write("(a==b) is " + (a==b));
        document.write("<br>");
        document.write("(a!=b) is " + (a!=b));
        document.write("<br>");
        document.write("(a&ltb) is "+ (a<b));
        document.write("<br>");
        document.write("(a>b) is " + (a>b));
        document.write("<br>");
        document.write("(a>=b) is " + (a>=b));
        document.write("<br>");
        document.write("(a<=b) is " + (a<=b));
        document.write("<br>");
 document.write("<hr>");
        // strictly equal to and not equal to operator
        document.write("strictly equal to operator: ");
        document.write("(a===b) is " + (a===b));
        document.write("<br>");
        document.write("not equal to operator: ");
        document.write("(a!==b) is " + (a!==b));
        document.write("<br>");
         document.write("<hr>");

        // logical operator
        document.write("logical operator: ");
        document.write("(a&&b) is " + (a&&b));
        document.write("<br>");
        document.write("(a||b) is " + (a||b));
        document.write("<br>");
        document.write("(!a) is " + (!a));
        document.write("<br>");
         document.write("<hr>");

        // assignment operator
        document.write("assignment operator: ");
        document.write("(a+=b) is " + (a+=b));
        document.write("<br>");
        document.write("(a-=b) is " + (a-=b));
        document.write("<br>");
        document.write("(a*=b) is " + (a*=b));
        document.write("<br>");
        document.write("(a/=b) is " + (a/=b));
        document.write("<br>");
         document.write("<hr>");

        // bitwise operator
        document.write("bitwise operator: ");
        document.write("(a&b) is " + (a&b));
        document.write("<br>");
        document.write("(a|b) is " + (a|b));
        document.write("<br>");
        document.write("(a^b) is " + (a^b));
        document.write("<br>");
        document.write("(a<<b) is " + (a<<b));
        document.write("<br>");
        document.write("(a>>b) is " + (a>>b));
        document.write("<br>");
         document.write("<hr>");
    </script></body>
</html>
