<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first javascript page</title>
</head>
<body>
    <p class="abc"></p>
    <p class="abc"></p>
    <p class="abc"></p>
    <p class="abc"></p>
    <p class="abc"></p>
    <p class="abc"></p>

    <script>
        var x=10;
        let y=100;
        document.getElementsByClassName("abc")[3].innerHTML=x;
        document.getElementsByClassName("abc")[1].innerHTML=y;
        document.getElementsByClassName("abc")[2].innerHTML=x+y;
        document.getElementsByClassName("abc")[0].innerHTML=x*y;
        document.getElementsByClassName("abc")[4].innerHTML=x/y;
        document.getElementsByClassName("abc")[5].innerHTML=x-y;

    </script>

</body>
</html>
